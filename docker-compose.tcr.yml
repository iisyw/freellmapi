services:
  freellmapi:
    container_name: freellmapi
    image: ccr.ccs.tencentyun.com/iisyw/freellmapi:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 14010
    network_mode: host
    volumes:
      - freellmapi-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:14010/api/ping').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  freellmapi-data:
